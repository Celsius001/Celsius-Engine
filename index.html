<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Celsius - Web Proxy</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            width: 100%;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 60px 40px;
            max-width: 600px;
            width: 100%;
        }

        .logo {
            text-align: center;
            margin-bottom: 40px;
        }

        .logo h1 {
            font-size: 42px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 700;
            letter-spacing: -1px;
        }

        .logo p {
            color: #666;
            font-size: 14px;
            margin-top: 8px;
            font-weight: 500;
        }

        .search-section {
            margin-bottom: 30px;
        }

        .input-group {
            display: flex;
            gap: 12px;
            margin-bottom: 16px;
        }

        .search-input {
            flex: 1;
            padding: 16px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 16px;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .search-input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .search-btn {
            padding: 16px 32px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .search-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }

        .search-btn:active {
            transform: translateY(0);
        }

        .info-text {
            font-size: 12px;
            color: #999;
            margin-top: 12px;
            text-align: center;
        }

        .examples {
            background: #f5f5f5;
            border-radius: 12px;
            padding: 20px;
            margin-top: 30px;
        }

        .examples h3 {
            font-size: 14px;
            color: #333;
            margin-bottom: 12px;
            font-weight: 600;
        }

        .examples ul {
            list-style: none;
        }

        .examples li {
            font-size: 13px;
            color: #666;
            margin-bottom: 8px;
            padding-left: 20px;
            position: relative;
        }

        .examples li:before {
            content: "→";
            position: absolute;
            left: 0;
            color: #667eea;
        }

        .loading {
            display: none;
            text-align: center;
            color: #666;
            font-size: 14px;
            margin-top: 20px;
        }

        .spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid #f3f3f3;
            border-top: 2px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 480px) {
            .container {
                padding: 40px 20px;
            }

            .logo h1 {
                font-size: 32px;
            }

            .input-group {
                flex-direction: column;
            }

            .search-btn {
                width: 100%;
            }

            .mode-toggle {
                flex-direction: column;
            }

            .mode-btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <h1>Celsius</h1>
            <p>Server-Side Web Proxy</p>
        </div>

        <div class="search-section">
            <div class="input-group">
                <input 
                    type="text" 
                    class="search-input" 
                    id="searchInput" 
                    placeholder="Search or enter a URL"
                    autocomplete="off"
                >
                <button class="search-btn" id="searchBtn">Go</button>
            </div>

            <div class="info-text" id="infoText">
                Enter a search query or a complete URL
            </div>
        </div>

        <div class="examples">
            <h3>Examples</h3>
            <ul>
                <li>Search: "weather today"</li>
                <li>URL: "https://example.com"</li>
            </ul>
        </div>

        <div class="loading" id="loading">
            <span class="spinner"></span>Loading...
        </div>
    </div>

    <script>
        const searchInput = document.getElementById('searchInput');
        const searchBtn = document.getElementById('searchBtn');
        const loading = document.getElementById('loading');

        function encodeUrl(url) {
            const encoded = btoa(url).replace(/\+/g, '-').replace(/\//g, '_').replace(/=/g, '');
            return encoded;
        }

        function isValidUrl(str) {
            try {
                new URL(str);
                return true;
            } catch {
                return false;
            }
        }

        function handleSearch() {
            const input = searchInput.value.trim();

            if (!input) return;

            let targetUrl;

            if (isValidUrl(input)) {
                targetUrl = input;
            } else {
                const query = encodeURIComponent(input);
                targetUrl = `https://duckduckgo.com/?q=${query}`;
            }

            const encoded = encodeUrl(targetUrl);
            loading.style.display = 'block';
            
            window.location.href = `/api/bare?url=${encoded}`;
        }

        searchBtn.addEventListener('click', handleSearch);

        searchInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                handleSearch();
            }
        });

        searchInput.focus();
    </script>
</body>
</html>
