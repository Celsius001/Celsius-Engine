<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Celsius Engine Sandbox</title>
    
    <script src="/celsius/celsius.config.js"></script>
    
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', async () => {
                try {
                    const registrations = await navigator.serviceWorker.getRegistrations();
                    for (let registration of registrations) {
                        if (registration.scope.includes('/celsius/')) {
                            await registration.unregister();
                            console.log('[Celsius] Successfully nuked old Service Worker.');
                        }
                    }

                    const reg = await navigator.serviceWorker.register('/sw.js');
                    console.log('[Celsius] Root SW Ready!', reg.scope);
                    
                } catch (err) {
                    console.error('[Celsius] SW Setup Failed:', err);
                }
            });
        }

        function loadUrl() {
            let input = document.getElementById('url-input').value.trim();
            if (!input) return;

            let targetUrl;
            const urlPattern = /^(https?:\/\/)?([a-zA-Z0-9-]+\.)+[a-zA-Z]{2,}(:\d+)?(\/.*)?$/;
            
            if (urlPattern.test(input)) {
                targetUrl = input.startsWith('http') ? input : 'https://' + input;
            } else {
                targetUrl = 'https://duckduckgo.com/?q=' + encodeURIComponent(input);
            }

            const encoded = self.__celsius$config.encodeUrl(targetUrl);
            const prefix = self.__celsius$config.prefix;

            document.getElementById('celsius-frame').src = prefix + encoded;
        }
    </script>

    <style>
        body { 
            font-family: system-ui, -apple-system, sans-serif; 
            background: #0d1117; 
            color: #c9d1d9; 
            padding: 20px; 
            margin: 0; 
        }
        h1 {
            margin-top: 0;
        }
        .nav-bar { 
            display: flex; 
            gap: 10px; 
            margin-bottom: 20px; 
            max-width: 1000px; 
        }
        input { 
            flex: 1; 
            padding: 12px; 
            border-radius: 6px; 
            border: 1px solid #30363d; 
            background: #161b22; 
            color: #fff; 
            font-size: 16px; 
        }
        input:focus {
            outline: none;
            border-color: #58a6ff;
        }
        button { 
            padding: 12px 24px; 
            border: none; 
            background: #238636; 
            color: white; 
            border-radius: 6px; 
            cursor: pointer; 
            font-weight: bold; 
            font-size: 16px;
        }
        button:hover { 
            background: #2ea043; 
        }
        iframe { 
            width: 100%; 
            height: 75vh; 
            border: 1px solid #30363d; 
            background: #fff; 
            border-radius: 6px; 
        }
    </style>
</head>
<body>
    <h1>Celsius Engine</h1>
    
    <div class="nav-bar">
        <input type="text" id="url-input" placeholder="Search DuckDuckGo or enter a URL..." onkeydown="if(event.key === 'Enter') loadUrl()">
        <button onclick="loadUrl()">Browse</button>
    </div>
    
    <iframe id="celsius-frame"></iframe>
</body>
</html>
